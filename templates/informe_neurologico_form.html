<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rellenar Informe Neurológico</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Estilos personalizados para centrar y dar un aspecto similar al dashboard */
        body {
            background-color: #f3f4f6; /* Un gris claro para el fondo */
            font-family: 'Inter', sans-serif; /* Si usas Inter, o tu fuente principal */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Alinea al inicio verticalmente */
            min-height: 100vh;
            padding: 20px;
        }
        .form-container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 900px; /* Ancho máximo para el formulario */
            margin-top: 50px; /* Margen superior para no estar pegado arriba */
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151; /* Color de texto más oscuro */
        }
        .form-group textarea, .form-group input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db; /* Borde gris claro */
            border-radius: 6px;
            font-size: 1rem;
            line-height: 1.5;
            color: #374151;
            background-color: #f9fafb; /* Fondo ligeramente más oscuro para los inputs */
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .form-group textarea:focus, .form-group input[type="text"]:focus {
            border-color: #3b82f6; /* Azul al enfocar */
            outline: 0;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); /* Sombra azul al enfocar */
        }
        .form-group textarea {
            min-height: 100px; /* Altura mínima para los textareas */
            resize: vertical;
        }
        .header-section {
            background-color: #edf2f7; /* Gris claro para el encabezado de datos del paciente */
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }
        .header-section p {
            font-size: 0.95rem;
            color: #4a5568;
            margin-bottom: 5px;
        }
        .header-section strong {
            color: #2d3748;
        }
        .submit-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            background-color: #10B981; /* Verde esmeralda */
            color: #ffffff;
            border: none;
            transition: background-color 0.2s ease-in-out;
            margin-top: 30px;
        }
        .submit-button:hover {
            background-color: #059669; /* Verde más oscuro al pasar el ratón */
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }
        .sub-section-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #374151;
            margin-top: 25px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Informe Neurológico</h1>

        <div class="header-section">
            <h2 class="sub-section-title">Datos del Paciente</h2>
            <p><strong>Nombre:</strong> <span id="paciente-nombre">Cargando...</span></p>
            <p><strong>RUT:</strong> <span id="paciente-rut">Cargando...</span></p>
            <p><strong>Fecha de Nacimiento:</strong> <span id="paciente-fecha-nacimiento">Cargando...</span></p>
            <p><strong>Edad:</strong> <span id="paciente-edad">Cargando...</span></p>
            <p><strong>Sexo:</strong> <span id="paciente-sexo">Cargando...</span></p>
            </div>

        <form id="informeNeurologicoForm" method="POST" action="/doctora/evaluar_informe_neurologico">
            <input type="hidden" id="estudiante_id" name="estudiante_id" value="">
            <input type="hidden" id="nomina_id" name="nomina_id" value="">
            <input type="hidden" id="doctora_id" name="doctora_id" value="">

            <h2 class="section-title">II. Historia Clínica</h2>
            <div class="form-group mb-6">
                <label for="motivo_consulta">Motivo de consulta:</label>
                <textarea id="motivo_consulta" name="motivo_consulta" rows="4" class="form-control" required></textarea>
            </div>
            <div class="form-group mb-6">
                <label for="historia_cuadro_actual">Historia del cuadro actual:</label>
                <textarea id="historia_cuadro_actual" name="historia_cuadro_actual" rows="6" class="form-control" required></textarea>
            </div>

            <h2 class="section-title">III. Examen Físico General</h2>
            <div class="form-group mb-6">
                <label for="observaciones_fisico_general">Observaciones:</label>
                <textarea id="observaciones_fisico_general" name="observaciones_fisico_general" rows="6" class="form-control" required></textarea>
            </div>

            <h2 class="section-title">IV. Examen Neurológico Específico</h2>
            <div class="form-group mb-6">
                <label for="observaciones_neurologico">Observaciones:</label>
                <textarea id="observaciones_neurologico" name="observaciones_neurologico" rows="6" class="form-control" required></textarea>
            </div>

            <h2 class="section-title">V. Diagnóstico</h2>
            <div class="form-group mb-6">
                <label for="diagnostico_sospecha">Diagnóstico de sospecha:</label>
                <textarea id="diagnostico_sospecha" name="diagnostico_sospecha" rows="4" class="form-control"></textarea>
            </div>
            <div class="form-group mb-6">
                <label for="diagnostico_definitivo">Diagnóstico definitivo:</label>
                <textarea id="diagnostico_definitivo" name="diagnostico_definitivo" rows="4" class="form-control"></textarea>
            </div>

            <h2 class="section-title">VI. Plan y Recomendaciones</h2>
            <div class="form-group mb-6">
                <label for="indicaciones">Indicaciones:</label>
                <textarea id="indicaciones" name="indicaciones" rows="6" class="form-control" required></textarea>
            </div>
            <div class="form-group mb-6">
                <label for="derivaciones">Derivaciones:</label>
                <textarea id="derivaciones" name="derivaciones" rows="4" class="form-control"></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="submit-button">Guardar y Generar Informe</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Obtener los IDs de la URL
            const urlParams = new URLSearchParams(window.location.search);
            const estudianteId = urlParams.get('estudiante_id');
            const nominaId = urlParams.get('nomina_id');
            const doctoraId = urlParams.get('doctora_id'); // Este será el ID de la Doctora LOGUEADA

            // Asignar los IDs a los campos ocultos del formulario
            document.getElementById('estudiante_id').value = estudianteId;
            document.getElementById('nomina_id').value = nominaId;
            document.getElementById('doctora_id').value = doctoraId;

            // Función para cargar los datos del estudiante desde el backend
            async function cargarDatosEstudiante(id) {
                try {
                    // Reemplaza '/api/estudiante-data' con la ruta real de tu API de Flask
                    // que devuelve los datos del estudiante por ID
                    const response = await fetch(`/api/estudiante-data?estudiante_id=${id}`);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    
                    // Rellenar los campos de datos del paciente
                    document.getElementById('paciente-nombre').textContent = data.nombre || 'N/A';
                    document.getElementById('paciente-rut').textContent = data.rut ? formatRut(data.rut) : 'N/A';
                    document.getElementById('paciente-fecha-nacimiento').textContent = data.fecha_nacimiento || 'N/A';
                    document.getElementById('paciente-edad').textContent = data.edad ? data.edad + ' años' : 'N/A';
                    document.getElementById('paciente-sexo').textContent = data.sexo || 'N/A';

                    // Si ya hay datos de un informe anterior (por ejemplo, al editar)
                    // Puedes cargarlos aquí para rellenar los textareas
                    document.getElementById('motivo_consulta').value = data.motivo_consulta || '';
                    document.getElementById('historia_cuadro_actual').value = data.historia_cuadro_actual || '';
                    document.getElementById('observaciones_fisico_general').value = data.observaciones_fisico_general || '';
                    document.getElementById('observaciones_neurologico').value = data.observaciones_neurologico || '';
                    document.getElementById('diagnostico_sospecha').value = data.diagnostico_sospecha || '';
                    document.getElementById('diagnostico_definitivo').value = data.diagnostico_definitivo || '';
                    document.getElementById('indicaciones').value = data.indicaciones || '';
                    document.getElementById('derivaciones').value = data.derivaciones || '';


                } catch (error) {
                    console.error('Error al cargar datos del estudiante:', error);
                    document.getElementById('paciente-nombre').textContent = 'Error al cargar';
                    document.getElementById('paciente-rut').textContent = 'Error al cargar';
                }
            }

            // Formatear RUT (ejemplo, puedes usar tu función Python si la tienes en JS)
            function formatRut(rut) {
                rut = rut.replace(/\./g, '').replace(/-/g, '');
                let cuerpo = rut.slice(0, -1);
                let dv = rut.slice(-1);
                return `${cuerpo}-${dv}`;
            }

            // Cargar los datos al iniciar la página si hay un estudiante_id
            if (estudianteId) {
                cargarDatosEstudiante(estudianteId);
            }
        });
    </script>
</body>
</html>
